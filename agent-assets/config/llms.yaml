# LLM providers available to the platform.
#
# Each provider becomes one LLM asset in the catalog (id: <domain>.llm.<key>);
# builders pick a provider for an agent and then one of its models.
#
# Credentials are never written here: `apiKeyEnv` names the environment
# variable that holds the key. Header values may reference env vars with ${VAR}.
#
# This file is embedded in the platform binary. A deployment can use a
# different file by setting LLM_CONFIG_PATH.

defaults:
  # Model used by L2 guardrails, as "<provider>:<model>".
  guardrailModel: claude-haiku:claude-haiku-5-5

providers:
  claude-haiku:
    name: Claude Haiku
    description: Anthropic's fastest, lowest-cost Claude models. Good for routing, chat and tool use.
    type: anthropic
    apiKeyEnv: ANTHROPIC_API_KEY
    models:
      - { id: claude-haiku-5-5, label: Claude Haiku 5.5, default: true, effort: true }
      - { id: claude-haiku-4-5, label: Claude Haiku 4.5 }
    params:
      maxTokens: 4096
      effort: low

  # An OpenAI-compatible gateway (LiteLLM, Portkey, Kong AI Gateway, ...).
  # Models are discovered from GET {baseURL}/models at startup and filtered.
  #
  # llm-gateway:
  #   name: LLM Gateway
  #   description: Company LLM gateway.
  #   type: openai
  #   baseURL: https://llm-gateway.internal/v1
  #   apiKeyEnv: LLM_GATEWAY_API_KEY
  #   headers:
  #     X-Client: ai-platform
  #     X-Team: ${TEAM_ID}
  #   discover:
  #     include: ["gpt-4.1*", "claude-*", "llama-3*"]
  #     exclude: ["*embedding*", "*whisper*"]
  #   models:   # optional: labels and the default; also used if discovery fails
  #     - { id: gpt-4.1-mini, label: GPT-4.1 mini, default: true }
  #   params:
  #     maxTokens: 4096

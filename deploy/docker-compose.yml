services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  demo-mcp:
    image: golang:1.27
    working_dir: /src/demo-mcp
    command: go run .
    environment:
      DEMO_MCP_ADDR: ":8081"
    ports:
      - "8081:8081"
    volumes:
      - ../demo-mcp:/src/demo-mcp
    profiles: ["full"]

  ms-llm-gateway:
    image: golang:1.27
    working_dir: /src/ms-llm-gateway
    command: go run ./cmd/gateway
    environment:
      GATEWAY_ADDR: ":8082"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_CONFIG_PATH: ${LLM_CONFIG_PATH:-}
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-}
    ports:
      - "8082:8082"
    volumes:
      - ../ms-llm-gateway:/src/ms-llm-gateway
    profiles: ["full"]

volumes:
  pgdata:
